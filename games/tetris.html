<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>俄羅斯方塊</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #eee;
    }

    #wrapper {
      display: flex;
      gap: 24px;
      align-items: flex-start;
    }

    canvas#board {
      border: 2px solid #444;
      background: #1a1a2e;
      display: block;
    }

    #side {
      width: 160px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .panel {
      background: #1e1e2f;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 14px;
    }

    .panel h3 {
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 8px;
    }

    .panel .value {
      font-size: 26px;
      font-weight: 700;
      color: #e2e8f0;
    }

    canvas#next, canvas#hold {
      display: block;
      margin: 0 auto;
    }

    #backBtn {
      background: none;
      border: 1px solid #333;
      color: #888;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      text-decoration: none;
      display: block;
      text-align: center;
    }
    #backBtn:hover { border-color: #555; color: #ccc; }

    #controls {
      font-size: 12px;
      color: #666;
      line-height: 1.9;
    }

    #controls span {
      color: #aaa;
    }

    button#btnStart {
      width: 100%;
      padding: 10px;
      background: #3b82f6;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button#btnStart:hover { background: #2563eb; }

    #msg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      pointer-events: none;
    }
    #msg h2 {
      font-size: 32px;
      color: #f1c40f;
      text-shadow: 0 0 12px rgba(241,196,15,0.6);
    }
    #msg p {
      font-size: 14px;
      color: #aaa;
      margin-top: 6px;
    }

    #board-wrap {
      position: relative;
    }
  </style>
</head>
<body>
<div id="wrapper">
  <!-- 主畫布 -->
  <div id="board-wrap">
    <canvas id="board" width="300" height="600"></canvas>
    <div id="msg">
      <h2 id="msgTitle">俄羅斯方塊</h2>
      <p id="msgSub">按下「開始」或 Enter 開始遊戲</p>
    </div>
  </div>

  <!-- 側邊面板 -->
  <div id="side">
    <a id="backBtn" href="index.html">← 返回目錄</a>
    <div class="panel">
      <h3>分數</h3>
      <div class="value" id="scoreVal">0</div>
    </div>
    <div class="panel">
      <h3>等級</h3>
      <div class="value" id="levelVal">1</div>
    </div>
    <div class="panel">
      <h3>消除行數</h3>
      <div class="value" id="linesVal">0</div>
    </div>
    <div class="panel">
      <h3>下一個</h3>
      <canvas id="next" width="120" height="120"></canvas>
    </div>
    <div class="panel">
      <h3>保留方塊</h3>
      <canvas id="hold" width="120" height="120"></canvas>
    </div>
    <button id="btnStart">開始 / 重啟</button>
    <div class="panel" id="controls">
      <h3>操作說明</h3>
      <span>←→</span> 左右移動<br>
      <span>↑ / Z</span> 旋轉<br>
      <span>↓</span> 加速下降<br>
      <span>Space</span> 直接落下<br>
      <span>C</span> 保留方塊<br>
      <span>P</span> 暫停
    </div>
  </div>
</div>

<script src="tetris-core.js"></script>
<script>
// ─── 畫布 ──────────────────────────────────────────────
// （COLS, ROWS, CELL, SHAPES, SCORE_TABLE, DAS, ARR,
//   makePiece, spawnPiece, levelInterval, pieceBlocks,
//   isValid, moveLeft, moveRight, moveDown, rotate,
//   hardDrop, holdPiece, clearLines, ghostY,
//   drawCell, drawBoard, drawPiecePreview → tetris-core.js）
const boardCanvas = document.getElementById('board');
const ctx = boardCanvas.getContext('2d');
const nextCanvas = document.getElementById('next');
const nctx = nextCanvas.getContext('2d');
const holdCanvas = document.getElementById('hold');
const hctx = holdCanvas.getContext('2d');

// ─── 遊戲狀態 ─────────────────────────────────────────
let board, current, next, hold, canHold, score, level, lines, gameOver, paused, animId, dropTimer, dropInterval;

// ─── 按住左右加速（DAS / ARR）─────────────────────────
const keys = {};   // 目前按住的鍵
let dasTimer = { ArrowLeft: 0, ArrowRight: 0 };
let arrTimer = { ArrowLeft: 0, ArrowRight: 0 };
let dasActive = { ArrowLeft: false, ArrowRight: false };

function initGame() {
  board = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
  score = 0; level = 1; lines = 0;
  gameOver = false; paused = false;
  hold = null; canHold = true;
  dropInterval = levelInterval(level);
  dropTimer = 0;
  dasTimer = { ArrowLeft: 0, ArrowRight: 0 };
  arrTimer = { ArrowLeft: 0, ArrowRight: 0 };
  dasActive = { ArrowLeft: false, ArrowRight: false };
  current = spawnPiece();
  next    = spawnPiece();
  updateHUD();
  hideMsg();
  cancelAnimationFrame(animId);
  lastTime = null;
  animId = requestAnimationFrame(loop);
}

// ─── 固定方塊 ─────────────────────────────────────────
function lock() {
  for (const [c, r] of pieceBlocks(current)) {
    if (r < 0) { endGame(); return; }
    board[r][c] = current.color;
  }
  clearLines();
  canHold = true;
  current = next;
  next    = spawnPiece();
  updateHUD();
  if (!isValid(current)) { endGame(); }
}

function drawNext() { drawPiecePreview(nctx, next.key, 120); }
function drawHold() { drawPiecePreview(hctx, hold, 120); }

// ─── HUD ──────────────────────────────────────────────
function updateHUD() {
  document.getElementById('scoreVal').textContent = score.toLocaleString();
  document.getElementById('levelVal').textContent = level;
  document.getElementById('linesVal').textContent = lines;
  drawNext();
  drawHold();
}

function hideMsg() {
  document.getElementById('msg').style.display = 'none';
}
function showMsg(title, sub) {
  document.getElementById('msg').style.display = 'block';
  document.getElementById('msgTitle').textContent = title;
  document.getElementById('msgSub').textContent   = sub;
}

function endGame() {
  gameOver = true;
  cancelAnimationFrame(animId);
  showMsg('遊戲結束', `分數：${score.toLocaleString()}　按 Enter 重新開始`);
}

// ─── 主迴圈 ───────────────────────────────────────────
let lastTime = null;

function loop(ts) {
  if (gameOver) return;
  if (!lastTime) lastTime = ts;
  const delta = ts - lastTime;
  lastTime = ts;

  if (!paused) {
    // 自動下降
    dropTimer += delta;
    if (dropTimer >= dropInterval) {
      dropTimer = 0;
      moveDown();
    }

    // DAS / ARR 左右連續移動
    for (const dir of ['ArrowLeft', 'ArrowRight']) {
      if (!keys[dir]) continue;
      if (!dasActive[dir]) {
        dasTimer[dir] += delta;
        if (dasTimer[dir] >= DAS) {
          dasActive[dir] = true;
          arrTimer[dir] = ARR; // 立即觸發第一次
        }
      } else {
        arrTimer[dir] += delta;
        if (arrTimer[dir] >= ARR) {
          arrTimer[dir] = 0;
          dir === 'ArrowLeft' ? moveLeft() : moveRight();
        }
      }
    }
  }

  drawBoard();
  animId = requestAnimationFrame(loop);
}

// ─── 鍵盤 ─────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') { initGame(); return; }
  if (gameOver) return;

  switch (e.key) {
    case 'ArrowLeft':
      e.preventDefault();
      if (!keys['ArrowLeft'] && !paused) moveLeft(); // 首次立即移動
      keys['ArrowLeft'] = true;
      break;
    case 'ArrowRight':
      e.preventDefault();
      if (!keys['ArrowRight'] && !paused) moveRight();
      keys['ArrowRight'] = true;
      break;
    case 'ArrowDown':  e.preventDefault(); if (!paused) { dropTimer = 0; moveDown(); } break;
    case 'ArrowUp':
    case 'z': case 'Z': e.preventDefault(); if (!paused) rotate(); break;
    case ' ':  e.preventDefault(); if (!paused) hardDrop(); break;
    case 'c': case 'C': e.preventDefault(); if (!paused) holdPiece(); break;
    case 'p': case 'P':
      paused = !paused;
      if (paused) showMsg('暫停', '按 P 繼續');
      else hideMsg();
      break;
  }
});

document.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    keys[e.key] = false;
    dasTimer[e.key] = 0;
    arrTimer[e.key] = 0;
    dasActive[e.key] = false;
  }
});

// ─── 按鈕 ─────────────────────────────────────────────
document.getElementById('btnStart').addEventListener('click', initGame);

// ─── 初始畫面 ─────────────────────────────────────────
showMsg('俄羅斯方塊', '按下「開始」或 Enter 開始遊戲');
drawBoard();
</script>
</body>
</html>
