<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>俄羅斯方塊</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #eee;
    }

    #wrapper {
      display: flex;
      gap: 24px;
      align-items: flex-start;
    }

    canvas#board {
      border: 2px solid #444;
      background: #1a1a2e;
      display: block;
    }

    #side {
      width: 160px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .panel {
      background: #1e1e2f;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 14px;
    }

    .panel h3 {
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 8px;
    }

    .panel .value {
      font-size: 26px;
      font-weight: 700;
      color: #e2e8f0;
    }

    canvas#next, canvas#hold {
      display: block;
      margin: 0 auto;
    }

    #backBtn {
      background: none;
      border: 1px solid #333;
      color: #888;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      text-decoration: none;
      display: block;
      text-align: center;
    }
    #backBtn:hover { border-color: #555; color: #ccc; }

    #controls {
      font-size: 12px;
      color: #666;
      line-height: 1.9;
    }

    #controls span {
      color: #aaa;
    }

    button#btnStart {
      width: 100%;
      padding: 10px;
      background: #3b82f6;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button#btnStart:hover { background: #2563eb; }

    #msg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      pointer-events: none;
    }
    #msg h2 {
      font-size: 32px;
      color: #f1c40f;
      text-shadow: 0 0 12px rgba(241,196,15,0.6);
    }
    #msg p {
      font-size: 14px;
      color: #aaa;
      margin-top: 6px;
    }

    #board-wrap {
      position: relative;
    }
  </style>
</head>
<body>
<div id="wrapper">
  <!-- 主畫布 -->
  <div id="board-wrap">
    <canvas id="board" width="300" height="600"></canvas>
    <div id="msg">
      <h2 id="msgTitle">俄羅斯方塊</h2>
      <p id="msgSub">按下「開始」或 Enter 開始遊戲</p>
    </div>
  </div>

  <!-- 側邊面板 -->
  <div id="side">
    <a id="backBtn" href="index.html">← 返回目錄</a>
    <div class="panel">
      <h3>分數</h3>
      <div class="value" id="scoreVal">0</div>
    </div>
    <div class="panel">
      <h3>等級</h3>
      <div class="value" id="levelVal">1</div>
    </div>
    <div class="panel">
      <h3>消除行數</h3>
      <div class="value" id="linesVal">0</div>
    </div>
    <div class="panel">
      <h3>下一個</h3>
      <canvas id="next" width="120" height="120"></canvas>
    </div>
    <div class="panel">
      <h3>保留方塊</h3>
      <canvas id="hold" width="120" height="120"></canvas>
    </div>
    <button id="btnStart">開始 / 重啟</button>
    <div class="panel" id="controls">
      <h3>操作說明</h3>
      <span>←→</span> 左右移動<br>
      <span>↑ / Z</span> 旋轉<br>
      <span>↓</span> 加速下降<br>
      <span>Space</span> 直接落下<br>
      <span>C</span> 保留方塊<br>
      <span>P</span> 暫停
    </div>
  </div>
</div>

<script>
// ─── 常數 ──────────────────────────────────────────────
const COLS = 10, ROWS = 20, CELL = 30;
const BOARD_W = COLS * CELL;   // 300
const BOARD_H = ROWS * CELL;   // 600

// 七種 Tetromino（SRS 標準旋轉系統）
const SHAPES = {
  I: { color: '#00cfcf', cells: [[0,1],[1,1],[2,1],[3,1]], rotations: [
        [[0,1],[1,1],[2,1],[3,1]],
        [[2,0],[2,1],[2,2],[2,3]],
        [[0,2],[1,2],[2,2],[3,2]],
        [[1,0],[1,1],[1,2],[1,3]]
      ]},
  O: { color: '#f5c518', cells: [[1,0],[2,0],[1,1],[2,1]], rotations: [
        [[1,0],[2,0],[1,1],[2,1]]
      ]},
  T: { color: '#a855f7', cells: [[1,0],[0,1],[1,1],[2,1]], rotations: [
        [[1,0],[0,1],[1,1],[2,1]],
        [[1,0],[1,1],[2,1],[1,2]],
        [[0,1],[1,1],[2,1],[1,2]],
        [[1,0],[0,1],[1,1],[1,2]]
      ]},
  S: { color: '#22c55e', cells: [[1,0],[2,0],[0,1],[1,1]], rotations: [
        [[1,0],[2,0],[0,1],[1,1]],
        [[1,0],[1,1],[2,1],[2,2]],
        [[1,1],[2,1],[0,2],[1,2]],
        [[0,0],[0,1],[1,1],[1,2]]
      ]},
  Z: { color: '#ef4444', cells: [[0,0],[1,0],[1,1],[2,1]], rotations: [
        [[0,0],[1,0],[1,1],[2,1]],
        [[2,0],[1,1],[2,1],[1,2]],
        [[0,1],[1,1],[1,2],[2,2]],
        [[1,0],[0,1],[1,1],[0,2]]
      ]},
  J: { color: '#3b82f6', cells: [[0,0],[0,1],[1,1],[2,1]], rotations: [
        [[0,0],[0,1],[1,1],[2,1]],
        [[1,0],[2,0],[1,1],[1,2]],
        [[0,1],[1,1],[2,1],[2,2]],
        [[1,0],[1,1],[0,2],[1,2]]
      ]},
  L: { color: '#f97316', cells: [[2,0],[0,1],[1,1],[2,1]], rotations: [
        [[2,0],[0,1],[1,1],[2,1]],
        [[1,0],[1,1],[1,2],[2,2]],
        [[0,1],[1,1],[2,1],[0,2]],
        [[0,0],[1,0],[1,1],[1,2]]
      ]}
};
const SHAPE_KEYS = Object.keys(SHAPES);

// 分數表 (單次消行)
const SCORE_TABLE = [0, 100, 300, 500, 800];

// ─── 畫布 ──────────────────────────────────────────────
const boardCanvas = document.getElementById('board');
const ctx = boardCanvas.getContext('2d');
const nextCanvas = document.getElementById('next');
const nctx = nextCanvas.getContext('2d');
const holdCanvas = document.getElementById('hold');
const hctx = holdCanvas.getContext('2d');

// ─── 遊戲狀態 ─────────────────────────────────────────
let board, current, next, hold, canHold, score, level, lines, gameOver, paused, animId, dropTimer, dropInterval;

// ─── 按住左右加速（DAS / ARR）─────────────────────────
// DAS = Delayed Auto Shift (首次延遲), ARR = Auto Repeat Rate (重複間隔)
const DAS = 170;   // ms，按住多久後開始連續移動
const ARR = 50;    // ms，連續移動間隔
const keys = {};   // 目前按住的鍵
let dasTimer = { ArrowLeft: 0, ArrowRight: 0 };
let arrTimer = { ArrowLeft: 0, ArrowRight: 0 };
let dasActive = { ArrowLeft: false, ArrowRight: false };

function initGame() {
  board = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
  score = 0; level = 1; lines = 0;
  gameOver = false; paused = false;
  hold = null; canHold = true;
  dropInterval = levelInterval(level);
  dropTimer = 0;
  dasTimer = { ArrowLeft: 0, ArrowRight: 0 };
  arrTimer = { ArrowLeft: 0, ArrowRight: 0 };
  dasActive = { ArrowLeft: false, ArrowRight: false };
  current = spawnPiece();
  next    = spawnPiece();
  updateHUD();
  hideMsg();
  cancelAnimationFrame(animId);
  lastTime = null;
  animId = requestAnimationFrame(loop);
}

// ─── 方塊工廠 ─────────────────────────────────────────
function spawnPiece() {
  const key = SHAPE_KEYS[Math.floor(Math.random() * SHAPE_KEYS.length)];
  return makePiece(key);
}

function levelInterval(lvl) {
  // 等級越高，間隔越短（最快 50ms）
  return Math.max(50, 800 - (lvl - 1) * 70);
}

// ─── 座標計算 ─────────────────────────────────────────
// cells 裡每個 [col, row] 加上 piece.x / piece.y 得到 board 座標
function pieceBlocks(piece, dx = 0, dy = 0, rot = piece.rot) {
  return piece.rotations[rot].map(([c, r]) => [piece.x + c + dx, piece.y + r + dy]);
}

function isValid(piece, dx = 0, dy = 0, rot = piece.rot) {
  for (const [c, r] of pieceBlocks(piece, dx, dy, rot)) {
    if (c < 0 || c >= COLS || r >= ROWS) return false;
    if (r >= 0 && board[r][c]) return false;
  }
  return true;
}

// ─── 移動 / 旋轉 ─────────────────────────────────────
function moveLeft()  { if (isValid(current, -1, 0)) current.x--; }
function moveRight() { if (isValid(current,  1, 0)) current.x++; }
function moveDown()  {
  if (isValid(current, 0, 1)) { current.y++; return true; }
  lock(); return false;
}

function rotate() {
  const newRot = (current.rot + 1) % current.rotations.length;
  // Wall kick: 嘗試 0, -1, +1, -2, +2
  for (const kick of [0, -1, 1, -2, 2]) {
    if (isValid(current, kick, 0, newRot)) {
      current.x += kick;
      current.rot = newRot;
      return;
    }
  }
}

function hardDrop() {
  while (isValid(current, 0, 1)) current.y++;
  lock();
}

// ─── 保留方塊 ─────────────────────────────────────────
function holdPiece() {
  if (!canHold) return;
  canHold = false;
  if (hold === null) {
    hold    = current.key;
    current = next;
    next    = spawnPiece();
  } else {
    const tmp = hold;
    hold = current.key;
    current = makePiece(tmp);
  }
  updateHUD();
}

function makePiece(key) {
  const def = SHAPES[key];
  return {
    key,
    color: def.color,
    rotations: def.rotations,
    rot: 0,
    x: Math.floor((COLS - 4) / 2),
    y: 0,
    get cells() { return this.rotations[this.rot]; }
  };
}

// ─── 固定方塊 ─────────────────────────────────────────
function lock() {
  for (const [c, r] of pieceBlocks(current)) {
    if (r < 0) { endGame(); return; }
    board[r][c] = current.color;
  }
  clearLines();
  canHold = true;
  current = next;
  next    = spawnPiece();
  updateHUD();
  if (!isValid(current)) { endGame(); }
}

function clearLines() {
  let cleared = 0;
  for (let r = ROWS - 1; r >= 0; r--) {
    if (board[r].every(c => c !== null)) {
      board.splice(r, 1);
      board.unshift(Array(COLS).fill(null));
      cleared++;
      r++; // 重新檢查同一行
    }
  }
  if (cleared > 0) {
    lines += cleared;
    score += SCORE_TABLE[cleared] * level;
    level = Math.floor(lines / 10) + 1;
    dropInterval = levelInterval(level);
  }
}

// ─── Ghost piece (落地預覽) ───────────────────────────
function ghostY() {
  let dy = 0;
  while (isValid(current, 0, dy + 1)) dy++;
  return dy;
}

// ─── 繪製 ─────────────────────────────────────────────
function drawCell(context, col, row, color, alpha = 1, offsetX = 0, offsetY = 0) {
  const x = offsetX + col * CELL;
  const y = offsetY + row * CELL;
  context.globalAlpha = alpha;
  context.fillStyle = color;
  context.fillRect(x + 1, y + 1, CELL - 2, CELL - 2);
  // 高光
  context.fillStyle = 'rgba(255,255,255,0.18)';
  context.fillRect(x + 1, y + 1, CELL - 2, 5);
  context.globalAlpha = 1;
}

function drawBoard() {
  ctx.clearRect(0, 0, BOARD_W, BOARD_H);

  // 格線
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 1;
  for (let c = 0; c <= COLS; c++) {
    ctx.beginPath(); ctx.moveTo(c * CELL, 0); ctx.lineTo(c * CELL, BOARD_H); ctx.stroke();
  }
  for (let r = 0; r <= ROWS; r++) {
    ctx.beginPath(); ctx.moveTo(0, r * CELL); ctx.lineTo(BOARD_W, r * CELL); ctx.stroke();
  }

  // 已落下的方塊
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (board[r][c]) drawCell(ctx, c, r, board[r][c]);
    }
  }

  if (gameOver || paused) return;

  // Ghost
  const gy = ghostY();
  if (gy > 0) {
    for (const [c, r] of pieceBlocks(current, 0, gy)) {
      if (r >= 0) drawCell(ctx, c, r, current.color, 0.22);
    }
  }

  // 當前方塊
  for (const [c, r] of pieceBlocks(current)) {
    if (r >= 0) drawCell(ctx, c, r, current.color);
  }
}

function drawPieceOnCanvas(context, key) {
  context.clearRect(0, 0, 120, 120);
  if (!key) return;
  const def = SHAPES[key];
  const cols = def.rotations[0].map(([c]) => c);
  const rows = def.rotations[0].map(([, r]) => r);
  const minC = Math.min(...cols), maxC = Math.max(...cols);
  const minR = Math.min(...rows), maxR = Math.max(...rows);
  const w = maxC - minC + 1, h = maxR - minR + 1;
  const ox = Math.floor((4 - w) / 2) - minC;
  const oy = Math.floor((4 - h) / 2) - minR;
  for (const [c, r] of def.rotations[0]) {
    drawCell(context, c + ox, r + oy, def.color, 1, 0, 0);
  }
}

function drawNext() { drawPieceOnCanvas(nctx, next.key); }
function drawHold() { drawPieceOnCanvas(hctx, hold); }

// ─── HUD ──────────────────────────────────────────────
function updateHUD() {
  document.getElementById('scoreVal').textContent = score.toLocaleString();
  document.getElementById('levelVal').textContent = level;
  document.getElementById('linesVal').textContent = lines;
  drawNext();
  drawHold();
}

function hideMsg() {
  document.getElementById('msg').style.display = 'none';
}
function showMsg(title, sub) {
  document.getElementById('msg').style.display = 'block';
  document.getElementById('msgTitle').textContent = title;
  document.getElementById('msgSub').textContent   = sub;
}

function endGame() {
  gameOver = true;
  cancelAnimationFrame(animId);
  showMsg('遊戲結束', `分數：${score.toLocaleString()}　按 Enter 重新開始`);
}

// ─── 主迴圈 ───────────────────────────────────────────
let lastTime = null;

function loop(ts) {
  if (gameOver) return;
  if (!lastTime) lastTime = ts;
  const delta = ts - lastTime;
  lastTime = ts;

  if (!paused) {
    // 自動下降
    dropTimer += delta;
    if (dropTimer >= dropInterval) {
      dropTimer = 0;
      moveDown();
    }

    // DAS / ARR 左右連續移動
    for (const dir of ['ArrowLeft', 'ArrowRight']) {
      if (!keys[dir]) continue;
      if (!dasActive[dir]) {
        dasTimer[dir] += delta;
        if (dasTimer[dir] >= DAS) {
          dasActive[dir] = true;
          arrTimer[dir] = ARR; // 立即觸發第一次
        }
      } else {
        arrTimer[dir] += delta;
        if (arrTimer[dir] >= ARR) {
          arrTimer[dir] = 0;
          dir === 'ArrowLeft' ? moveLeft() : moveRight();
        }
      }
    }
  }

  drawBoard();
  animId = requestAnimationFrame(loop);
}

// ─── 鍵盤 ─────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') { initGame(); return; }
  if (gameOver) return;

  switch (e.key) {
    case 'ArrowLeft':
      e.preventDefault();
      if (!keys['ArrowLeft'] && !paused) moveLeft(); // 首次立即移動
      keys['ArrowLeft'] = true;
      break;
    case 'ArrowRight':
      e.preventDefault();
      if (!keys['ArrowRight'] && !paused) moveRight();
      keys['ArrowRight'] = true;
      break;
    case 'ArrowDown':  e.preventDefault(); if (!paused) { dropTimer = 0; moveDown(); } break;
    case 'ArrowUp':
    case 'z': case 'Z': e.preventDefault(); if (!paused) rotate(); break;
    case ' ':  e.preventDefault(); if (!paused) hardDrop(); break;
    case 'c': case 'C': e.preventDefault(); if (!paused) holdPiece(); break;
    case 'p': case 'P':
      paused = !paused;
      if (paused) showMsg('暫停', '按 P 繼續');
      else hideMsg();
      break;
  }
});

document.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    keys[e.key] = false;
    dasTimer[e.key] = 0;
    arrTimer[e.key] = 0;
    dasActive[e.key] = false;
  }
});

// ─── 按鈕 ─────────────────────────────────────────────
document.getElementById('btnStart').addEventListener('click', initGame);

// ─── 初始畫面 ─────────────────────────────────────────
showMsg('俄羅斯方塊', '按下「開始」或 Enter 開始遊戲');
drawBoard();
</script>
</body>
</html>
