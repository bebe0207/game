<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>貪吃蛇</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d1a;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #e2e8f0; gap: 14px;
      user-select: none;
    }

    #topbar {
      display: flex; align-items: center; gap: 20px;
      width: min(420px, 96vw);
    }
    #backBtn {
      background: none; border: 1px solid #333; color: #888;
      padding: 6px 14px; border-radius: 6px; cursor: pointer;
      font-size: 13px; text-decoration: none; transition: all .2s;
    }
    #backBtn:hover { border-color: #22c55e; color: #22c55e; }
    #topbar h1 { font-size: 20px; font-weight: 700; flex: 1; text-align: center; }

    /* HUD */
    .hud {
      display: flex; gap: 24px; font-size: 13px; color: #888;
      background: #12112a; border: 1px solid #1f2a1f;
      border-radius: 10px; padding: 10px 20px;
      width: min(420px, 96vw); justify-content: space-around;
    }
    .hud-item { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .hud-label { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: #4a5568; }
    .hud-val { font-size: 22px; font-weight: 800; color: #22c55e; line-height: 1; }
    .hud-val.gold { color: #f5c518; }
    .hud-val.blue { color: #60a5fa; }

    /* 連擊提示 */
    #combo-toast {
      position: fixed; top: 20%; left: 50%; transform: translateX(-50%);
      font-size: 22px; font-weight: 800; color: #f5c518;
      text-shadow: 0 0 16px rgba(245,197,24,0.8);
      pointer-events: none; opacity: 0;
      transition: opacity .1s;
      z-index: 100;
    }

    canvas {
      background: #080f10;
      border: 2px solid #1f3a2f;
      border-radius: 6px; display: block;
      width: min(420px, 96vw); height: min(420px, 96vw);
      image-rendering: pixelated;
    }

    #wrap { position: relative; }

    #msg {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(8,15,16,0.94);
      border: 1px solid #1f3a2f; border-radius: 14px;
      padding: 24px 36px; text-align: center;
      pointer-events: all; min-width: 220px;
    }
    #msg h2 { font-size: 26px; color: #22c55e; margin-bottom: 6px; }
    #msg .sub { font-size: 13px; color: #666; margin-bottom: 14px; line-height: 1.6; }

    .btn-green {
      padding: 10px 32px; background: #22c55e;
      border: none; border-radius: 8px;
      color: #000; font-size: 15px; font-weight: 700;
      cursor: pointer; transition: background .15s;
    }
    .btn-green:hover { background: #16a34a; }

    /* 觸控方向盤 */
    #dpad {
      display: none;
      grid-template-columns: repeat(3, 52px);
      grid-template-rows: repeat(3, 52px);
      gap: 4px; margin-top: 4px;
    }
    @media (pointer: coarse) { #dpad { display: grid; } }

    .dpad-btn {
      background: rgba(34,197,94,0.12);
      border: 1px solid rgba(34,197,94,0.3);
      border-radius: 8px; color: #22c55e;
      font-size: 20px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
      transition: background .1s;
    }
    .dpad-btn:active { background: rgba(34,197,94,0.3); }
    .dpad-center { background: transparent; border: none; }

    #controls {
      font-size: 12px; color: #333; text-align: center; line-height: 2;
    }
    #controls span { color: #555; }

    /* 分數彈出 */
    .score-pop {
      position: absolute; font-size: 14px; font-weight: 700;
      pointer-events: none; animation: popUp .8s ease forwards;
      color: #4ade80; text-shadow: 0 0 8px rgba(74,222,128,.7);
    }
    @keyframes popUp {
      0%   { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-40px) scale(1.3); }
    }
  </style>
</head>
<body>

<div id="topbar">
  <a id="backBtn" href="index.html">← 返回</a>
  <h1>🐍 貪吃蛇</h1>
  <div style="width:72px"></div>
</div>

<div class="hud">
  <div class="hud-item">
    <span class="hud-label">分數</span>
    <span class="hud-val" id="scoreVal">0</span>
  </div>
  <div class="hud-item">
    <span class="hud-label">最高</span>
    <span class="hud-val gold" id="bestVal">0</span>
  </div>
  <div class="hud-item">
    <span class="hud-label">等級</span>
    <span class="hud-val blue" id="levelVal">1</span>
  </div>
  <div class="hud-item">
    <span class="hud-label">連擊</span>
    <span class="hud-val" id="comboVal" style="color:#f97316">x1</span>
  </div>
</div>

<div id="combo-toast" id="comboToast"></div>

<div id="wrap">
  <canvas id="cv" width="420" height="420"></canvas>
  <div id="msg">
    <h2>🐍 貪吃蛇</h2>
    <div class="sub">吃食物得分，別碰到牆或自己！<br>🍎 普通食物 +1 分<br>⭐ 黃金食物 +3 分（限時！）<br>💜 紫色食物 +5 分（極稀有！）</div>
    <button class="btn-green" id="btnStart">開始遊戲</button>
  </div>
</div>

<!-- 觸控方向盤 -->
<div id="dpad">
  <div></div>
  <button class="dpad-btn" id="dUp">▲</button>
  <div></div>
  <button class="dpad-btn" id="dLeft">◀</button>
  <div class="dpad-center"></div>
  <button class="dpad-btn" id="dRight">▶</button>
  <div></div>
  <button class="dpad-btn" id="dDown">▼</button>
  <div></div>
</div>

<div id="controls">
  <span>↑↓←→ / WASD</span> 移動 &nbsp; <span>P</span> 暫停 &nbsp; <span>Enter</span> 重新開始
</div>

<script>
const COLS = 21, ROWS = 21, CELL = 20;
const W = COLS * CELL, H = ROWS * CELL;
const cv  = document.getElementById('cv');
const ctx = cv.getContext('2d');

// ── 狀態 ──────────────────────────────────────────────
let snake, dir, nextDir, food, bonusFood, bonusTimer;
let score, best = 0, level, combo, gameOver, paused, loopId;
let particles = [];  // 死亡 / 吃到食物 粒子

const SPEEDS = [190, 160, 130, 105, 82, 64, 50, 40, 32, 25];

// ── 食物類型 ──────────────────────────────────────────
const FOOD_TYPES = {
  normal: { color: '#ef4444', glow: '#ff6b6b', points: 1, emoji: '🍎' },
  bonus:  { color: '#f5c518', glow: '#ffd700', points: 3, emoji: '⭐' },
  rare:   { color: '#a855f7', glow: '#c084fc', points: 5, emoji: '💜' },
};

// ── 初始化 ────────────────────────────────────────────
function initGame() {
  const mid = Math.floor(COLS / 2);
  snake   = [{x:mid,y:mid},{x:mid-1,y:mid},{x:mid-2,y:mid}];
  dir     = {x:1, y:0};
  nextDir = {x:1, y:0};
  score = 0; level = 1; combo = 1;
  bonusFood = null; bonusTimer = 0;
  gameOver = false; paused = false;
  particles = [];
  placeFood();
  updateHUD();
  hideMsg();
  clearTimeout(loopId);
  step();
}

function placeFood() {
  let pos;
  do { pos = {x:Math.floor(Math.random()*COLS), y:Math.floor(Math.random()*ROWS)}; }
  while (snake.some(s=>s.x===pos.x&&s.y===pos.y));
  food = { ...pos, type: 'normal' };

  // 10% 機率生成限時黃金食物
  if (!bonusFood && Math.random() < 0.1) spawnBonusFood();
}

function spawnBonusFood() {
  let pos;
  do { pos = {x:Math.floor(Math.random()*COLS), y:Math.floor(Math.random()*ROWS)}; }
  while (snake.some(s=>s.x===pos.x&&s.y===pos.y) || (food&&pos.x===food.x&&pos.y===food.y));
  const isRare = Math.random() < 0.2;
  bonusFood = { ...pos, type: isRare ? 'rare' : 'bonus', timeLeft: isRare ? 5000 : 8000 };
}

// ── 主步驟 ────────────────────────────────────────────
let lastTs = 0;
function step(ts = 0) {
  if (gameOver || paused) return;

  const delta = ts - lastTs;
  lastTs = ts;

  // 更新限時食物計時
  if (bonusFood) {
    bonusFood.timeLeft -= delta;
    if (bonusFood.timeLeft <= 0) { bonusFood = null; combo = Math.max(1, combo - 1); }
  }

  // 更新粒子
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => { p.x+=p.vx; p.y+=p.vy; p.vy+=0.3; p.life-=3; p.vx*=0.96; });

  dir = nextDir;
  const head = {x: snake[0].x+dir.x, y: snake[0].y+dir.y};

  if (head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS||snake.some(s=>s.x===head.x&&s.y===head.y)) {
    triggerDeath(); return;
  }

  snake.unshift(head);
  let ate = false;

  // 吃到普通食物
  if (head.x===food.x && head.y===food.y) {
    const pts = FOOD_TYPES.normal.points * combo;
    score += pts;
    combo = Math.min(8, combo + 1);
    spawnScorePop(head.x, head.y, `+${pts}`);
    spawnEatParticles(head.x, head.y, '#ef4444');
    placeFood();
    ate = true;
  }
  // 吃到限時食物
  else if (bonusFood && head.x===bonusFood.x && head.y===bonusFood.y) {
    const ft = FOOD_TYPES[bonusFood.type];
    const pts = ft.points * combo;
    score += pts;
    combo = Math.min(8, combo + 2);
    showComboToast(`${ft.emoji} +${pts} COMBO x${combo}`);
    spawnScorePop(head.x, head.y, `+${pts}`, ft.color);
    spawnEatParticles(head.x, head.y, ft.glow);
    bonusFood = null;
    ate = true;
  }

  if (!ate) { snake.pop(); combo = Math.max(1, combo); }
  if (score > best) best = score;
  level = Math.min(10, Math.floor(score/5)+1);
  updateHUD();
  draw();
  loopId = setTimeout(() => requestAnimationFrame(step), SPEEDS[level-1]);
}

// ── 死亡動畫 ─────────────────────────────────────────
function triggerDeath() {
  // 爆炸粒子
  for (const seg of snake) {
    for (let i = 0; i < 6; i++) {
      const angle = Math.random()*Math.PI*2;
      const speed = 1+Math.random()*3;
      particles.push({
        x: seg.x*CELL+CELL/2, y: seg.y*CELL+CELL/2,
        vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed - 1,
        color: `hsl(${100+Math.random()*60},80%,50%)`, life: 100, size: 3+Math.random()*3
      });
    }
  }
  // 先畫一幀粒子再結束
  draw();
  setTimeout(() => {
    gameOver = true;
    if (score > best) best = score;
    updateHUD();
    showMsg('💀 遊戲結束', `分數：${score}　最高：${best}`);
  }, 300);
}

// ── 吃食物粒子 ───────────────────────────────────────
function spawnEatParticles(gx, gy, color) {
  for (let i = 0; i < 8; i++) {
    const angle = Math.random()*Math.PI*2;
    const speed = 1.5+Math.random()*2.5;
    particles.push({
      x: gx*CELL+CELL/2, y: gy*CELL+CELL/2,
      vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed-1.5,
      color, life: 70, size: 2+Math.random()*3
    });
  }
}

// ── 分數彈出 ─────────────────────────────────────────
function spawnScorePop(gx, gy, text, color='#4ade80') {
  const wrap = document.getElementById('wrap');
  const rect = cv.getBoundingClientRect();
  const scale = rect.width / W;
  const el = document.createElement('div');
  el.className = 'score-pop';
  el.textContent = text;
  el.style.left  = (gx*CELL*scale + rect.left - wrap.getBoundingClientRect().left) + 'px';
  el.style.top   = (gy*CELL*scale + rect.top  - wrap.getBoundingClientRect().top ) + 'px';
  el.style.color = color;
  wrap.appendChild(el);
  setTimeout(() => el.remove(), 820);
}

// ── 連擊提示 ─────────────────────────────────────────
let comboToastTimer;
function showComboToast(msg) {
  const el = document.getElementById('combo-toast');
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(comboToastTimer);
  comboToastTimer = setTimeout(() => { el.style.opacity = '0'; }, 1400);
}

// ── 繪製 ─────────────────────────────────────────────
let tick = 0;
function draw() {
  tick++;
  ctx.fillStyle = '#080f10';
  ctx.fillRect(0, 0, W, H);

  // 格線
  ctx.strokeStyle = 'rgba(34,197,94,0.04)';
  ctx.lineWidth = 1;
  for (let c=0;c<=COLS;c++){ctx.beginPath();ctx.moveTo(c*CELL,0);ctx.lineTo(c*CELL,H);ctx.stroke();}
  for (let r=0;r<=ROWS;r++){ctx.beginPath();ctx.moveTo(0,r*CELL);ctx.lineTo(W,r*CELL);ctx.stroke();}

  // 粒子
  for (const p of particles) {
    ctx.globalAlpha = p.life/100;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 食物（閃爍光暈）
  drawFood(food.x, food.y, FOOD_TYPES.normal);

  // 限時食物
  if (bonusFood) {
    const ft = FOOD_TYPES[bonusFood.type];
    // 剩餘時間越少閃爍越快
    const blink = bonusFood.timeLeft < 2000 ? Math.floor(tick/4)%2===0 : true;
    if (blink) drawFood(bonusFood.x, bonusFood.y, ft, bonusFood.timeLeft);
  }

  // 蛇
  snake.forEach((seg, i) => {
    const t = i / snake.length;
    const hue = 142 - t*25;
    const sat = 75 - t*20;
    const lit = 50 - t*18;
    ctx.fillStyle = i===0 ? '#4ade80' : `hsl(${hue},${sat}%,${lit}%)`;

    // 圓角方塊
    const x=seg.x*CELL+1, y=seg.y*CELL+1, s=CELL-2;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x,y,s,s,4);
    else ctx.rect(x,y,s,s);
    ctx.fill();

    // 頭部高光
    if (i===0) {
      ctx.fillStyle='rgba(255,255,255,0.3)';
      ctx.fillRect(seg.x*CELL+2, seg.y*CELL+2, CELL-4, 5);
      // 眼睛
      ctx.fillStyle='#0a1a0a';
      const [e1x,e1y,e2x,e2y] = getEyePos(dir, seg);
      ctx.beginPath(); ctx.arc(e1x,e1y,2,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(e2x,e2y,2,0,Math.PI*2); ctx.fill();
    }
  });
}

function drawFood(gx, gy, ft, timeLeft) {
  const cx = gx*CELL+CELL/2, cy = gy*CELL+CELL/2;
  const pulse = 1 + 0.12*Math.sin(tick*0.15);
  // 光暈
  const grad = ctx.createRadialGradient(cx,cy,0,cx,cy,CELL*0.8*pulse);
  grad.addColorStop(0, ft.glow+'44');
  grad.addColorStop(1, 'transparent');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(cx,cy,CELL*0.8,0,Math.PI*2); ctx.fill();
  // 實體
  ctx.fillStyle = ft.color;
  ctx.beginPath(); ctx.arc(cx,cy,(CELL/2-1)*pulse,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.35)';
  ctx.beginPath(); ctx.arc(cx-2,cy-2,3,0,Math.PI*2); ctx.fill();

  // 限時條
  if (timeLeft !== undefined) {
    const maxT = ft.points===5 ? 5000 : 8000;
    const pct = timeLeft/maxT;
    ctx.fillStyle='rgba(0,0,0,0.5)';
    ctx.fillRect(gx*CELL, gy*CELL+CELL-3, CELL, 3);
    ctx.fillStyle = pct > 0.4 ? ft.color : '#ef4444';
    ctx.fillRect(gx*CELL, gy*CELL+CELL-3, CELL*pct, 3);
  }
}

function getEyePos(d, seg) {
  const bx=seg.x*CELL, by=seg.y*CELL;
  if (d.x===1)  return [bx+14,by+5, bx+14,by+13];
  if (d.x===-1) return [bx+4, by+5, bx+4, by+13];
  if (d.y===-1) return [bx+5, by+4, bx+13,by+4 ];
  return                [bx+5, by+14,bx+13,by+14];
}

// ── HUD ──────────────────────────────────────────────
function updateHUD() {
  document.getElementById('scoreVal').textContent = score;
  document.getElementById('bestVal').textContent  = best;
  document.getElementById('levelVal').textContent = level;
  document.getElementById('comboVal').textContent = `x${combo}`;
}

function hideMsg() { document.getElementById('msg').style.display = 'none'; }
function showMsg(title, sub) {
  const m = document.getElementById('msg');
  m.style.display='block';
  m.innerHTML=`<h2>${title}</h2><div class="sub">${sub}</div><button class="btn-green" onclick="initGame()">再玩一次</button>`;
}

// ── 鍵盤 ─────────────────────────────────────────────
const DIR_MAP = {
  ArrowUp:{x:0,y:-1}, w:{x:0,y:-1}, W:{x:0,y:-1},
  ArrowDown:{x:0,y:1}, s:{x:0,y:1}, S:{x:0,y:1},
  ArrowLeft:{x:-1,y:0}, a:{x:-1,y:0}, A:{x:-1,y:0},
  ArrowRight:{x:1,y:0}, d:{x:1,y:0}, D:{x:1,y:0},
};

function tryDir(d) {
  if (!d) return;
  if (d.x !== -dir.x || d.y !== -dir.y) nextDir = d;
}

document.addEventListener('keydown', e => {
  if (e.key==='Enter') { initGame(); return; }
  if (gameOver) return;
  const d = DIR_MAP[e.key];
  if (d) { e.preventDefault(); tryDir(d); }
  if (e.key==='p'||e.key==='P') {
    paused = !paused;
    if (!paused) { lastTs=0; requestAnimationFrame(step); }
  }
});

// ── 觸控方向盤 ────────────────────────────────────────
[['dUp',{x:0,y:-1}],['dDown',{x:0,y:1}],['dLeft',{x:-1,y:0}],['dRight',{x:1,y:0}]]
  .forEach(([id, d]) => {
    document.getElementById(id).addEventListener('touchstart', e => {
      e.preventDefault(); if (!gameOver&&!paused) tryDir(d);
    }, {passive:false});
  });

// ── 滑動手勢 ─────────────────────────────────────────
let touchStart = null;
cv.addEventListener('touchstart', e=>{touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:true});
cv.addEventListener('touchend', e=>{
  if (!touchStart) return;
  const dx=e.changedTouches[0].clientX-touchStart.x;
  const dy=e.changedTouches[0].clientY-touchStart.y;
  if (Math.abs(dx)>Math.abs(dy)) tryDir(dx>0?{x:1,y:0}:{x:-1,y:0});
  else tryDir(dy>0?{x:0,y:1}:{x:0,y:-1});
  touchStart=null;
},{passive:true});

document.getElementById('btnStart').addEventListener('click', initGame);

ctx.fillStyle='#080f10'; ctx.fillRect(0,0,W,H);
</script>
</body>
</html>
