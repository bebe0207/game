<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <!-- Render WebSocket 伺服器 -->
  <meta name="ws-url" content="wss://game-ws-server-5xjh.onrender.com">
  <title>貪吃蛇 對戰</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080f10;
      --surface: #0f1f20;
      --border: #1f3a2f;
      --p1: #4ade80;   /* 玩家1：綠色 */
      --p2: #f87171;   /* 玩家2：紅色 */
      --food1: #86efac;
      --food2: #fca5a5;
      --gold: #f5c518;
      --muted: #4a6a5a;
      --text: #e2e8f0;
    }

    body {
      background: var(--bg);
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: var(--text);
      user-select: none;
    }

    /* ── 頂部 ── */
    #topbar {
      width: 100%; display: flex; align-items: center; justify-content: space-between;
      padding: 13px 24px;
      border-bottom: 1px solid var(--border);
      background: rgba(8,15,16,0.92);
      position: sticky; top: 0; z-index: 20;
    }
    #topbar a {
      color: var(--muted); font-size: 13px; text-decoration: none;
      border: 1px solid var(--border); padding: 5px 14px; border-radius: 6px;
      transition: all .2s;
    }
    #topbar a:hover { color: var(--text); border-color: var(--p1); }
    #topbar h1 { font-size: 18px; font-weight: 800; }
    #topbar h1 span { color: var(--p1); }

    /* ══════════ LOBBY ══════════ */
    #lobby {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: calc(100vh - 50px);
      gap: 24px; padding: 40px 20px;
    }

    .lobby-title h2 {
      font-size: 30px; font-weight: 800; text-align: center;
      background: linear-gradient(135deg, var(--p1), #22c55e, #16a34a);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .lobby-title p { color: var(--muted); font-size: 14px; text-align: center; }

    .lobby-box {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 24px 28px;
      width: 100%; max-width: 380px;
      display: flex; flex-direction: column; gap: 14px;
    }
    .lobby-box h3 { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }

    .lobby-btn {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      border: none; border-radius: 10px;
      color: #000; font-size: 15px; font-weight: 700;
      cursor: pointer; transition: opacity .15s, transform .1s;
    }
    .lobby-btn:hover { opacity: .88; transform: translateY(-1px); }
    .lobby-btn.sec {
      background: var(--surface); border: 1px solid var(--border); color: var(--text);
    }
    .lobby-btn.sec:hover { border-color: var(--p1); }

    .input-row { display: flex; gap: 10px; }
    .input-row input {
      flex: 1; background: rgba(255,255,255,0.05);
      border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); font-size: 22px; font-weight: 800;
      padding: 9px 12px; letter-spacing: 6px; text-align: center; outline: none;
      transition: border-color .2s;
    }
    .input-row input:focus { border-color: var(--p1); }
    .input-row input::placeholder { letter-spacing: 1px; font-size: 13px; font-weight: 400; }

    #roomCodeDisplay {
      font-size: 46px; font-weight: 900; color: var(--gold);
      letter-spacing: 12px; text-align: center;
      text-shadow: 0 0 20px rgba(245,197,24,.4);
    }
    .status-text { font-size: 13px; color: var(--muted); text-align: center; }
    #lobbyError  { font-size: 13px; color: #f87171; text-align: center; min-height: 18px; }

    /* ══════════ BATTLE ══════════ */
    #battle {
      display: none;
      flex-direction: column; align-items: center;
      gap: 12px; padding: 16px 12px 40px; width: 100%;
    }

    /* 分數列 */
    #scorebar {
      display: flex; align-items: center; justify-content: space-between;
      width: min(500px, 96vw);
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 18px;
    }
    .score-block { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .score-block .s-label { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; }
    .score-block .s-val   { font-size: 24px; font-weight: 900; line-height: 1; }
    .s-label.p1 { color: var(--p1); }
    .s-label.p2 { color: var(--p2); }
    .s-val.p1   { color: var(--p1); }
    .s-val.p2   { color: var(--p2); }
    .vs-mid { font-size: 18px; font-weight: 900; color: var(--muted); }

    /* 主畫布 */
    #game-wrap { position: relative; }
    canvas#cv {
      display: block;
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: 6px;
      width: min(500px, 96vw);
      height: min(500px, 96vw);
    }

    /* 房間碼小標 */
    #room-tag {
      font-size: 11px; color: var(--muted);
      letter-spacing: 1px;
    }
    #room-tag span { color: var(--gold); font-weight: 700; letter-spacing: 3px; }

    /* 等待覆蓋 */
    #waiting {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.75); z-index: 40;
      flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    }
    #waiting.show { display: flex; }
    #waiting p { font-size: 18px; }
    .spinner {
      width: 38px; height: 38px;
      border: 3px solid rgba(74,222,128,.2); border-top-color: var(--p1);
      border-radius: 50%; animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 結果覆蓋 */
    #result {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.8); z-index: 50;
      align-items: center; justify-content: center;
    }
    #result.show { display: flex; }
    .result-box {
      background: #0f1f20; border: 1px solid var(--border);
      border-radius: 18px; padding: 36px 52px;
      text-align: center; display: flex; flex-direction: column; gap: 14px;
    }
    .result-box h2     { font-size: 40px; font-weight: 900; }
    .result-box h2.win { color: var(--gold); text-shadow: 0 0 24px rgba(245,197,24,.6); }
    .result-box h2.lose{ color: #f87171; }
    .result-box p      { font-size: 14px; color: var(--muted); }
    .result-btns { display: flex; gap: 10px; justify-content: center; }
    .rbtn {
      padding: 11px 26px; border-radius: 8px;
      font-size: 14px; font-weight: 700; cursor: pointer; border: none; transition: opacity .15s;
    }
    .rbtn:hover { opacity: .85; }
    .rbtn.primary { background: #22c55e; color: #000; }
    .rbtn.ghost   { background: var(--surface); border: 1px solid var(--border); color: var(--text); }

    /* 觸控方向盤 */
    #dpad {
      display: none;
      grid-template-columns: repeat(3, 52px);
      grid-template-rows: repeat(3, 52px);
      gap: 4px;
    }
    @media (pointer: coarse) { #dpad { display: grid; } }
    .dp {
      background: rgba(74,222,128,.1); border: 1px solid rgba(74,222,128,.25);
      border-radius: 8px; color: var(--p1); font-size: 20px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .dp:active { background: rgba(74,222,128,.3); }

    #controls { font-size: 12px; color: #333; text-align: center; line-height: 2; }
    #controls span { color: #555; }
  </style>
</head>
<body>

<div id="topbar">
  <a href="index.html">← 返回目錄</a>
  <h1>🐍 貪吃蛇 <span>對戰</span></h1>
  <div style="width:90px"></div>
</div>

<!-- ══════ LOBBY ══════ -->
<div id="lobby">
  <div class="lobby-title">
    <h2>🐍 雙人同場對戰</h2>
    <p>兩條蛇在同一棋盤，碰到對方身體就死！</p>
  </div>

  <div class="lobby-box">
    <h3>建立新房間</h3>
    <button class="lobby-btn" id="btnCreate">建立房間</button>
    <div id="createResult" style="display:none">
      <h3 style="margin-bottom:8px">房間碼（傳給對手）</h3>
      <div id="roomCodeDisplay">----</div>
      <p class="status-text" style="margin-top:8px">⏳ 等待對手加入...</p>
    </div>
  </div>

  <div class="lobby-box">
    <h3>加入現有房間</h3>
    <div class="input-row">
      <input id="joinInput" type="text" maxlength="4" placeholder="輸入房間碼" />
      <button class="lobby-btn sec" id="btnJoin" style="width:auto;padding:9px 16px">加入</button>
    </div>
  </div>

  <div id="lobbyError"></div>
</div>

<!-- ══════ BATTLE ══════ -->
<div id="battle">
  <div id="scorebar">
    <div class="score-block">
      <span class="s-label p1">🟢 你</span>
      <span class="s-val p1"  id="myScore">0</span>
    </div>
    <div class="vs-mid">VS</div>
    <div class="score-block">
      <span class="s-label p2">🔴 對手</span>
      <span class="s-val p2"  id="oppScore">0</span>
    </div>
  </div>

  <div id="room-tag">房間 <span id="battleRoomCode">----</span></div>

  <div id="game-wrap">
    <canvas id="cv" width="500" height="500"></canvas>
  </div>

  <div id="dpad">
    <div></div><button class="dp" id="dUp">▲</button><div></div>
    <button class="dp" id="dLeft">◀</button><div></div><button class="dp" id="dRight">▶</button>
    <div></div><button class="dp" id="dDown">▼</button><div></div>
  </div>

  <div id="controls">
    <span>↑↓←→ / WASD</span> 移動 &nbsp; <span>P</span> 暫停
  </div>
</div>

<!-- 等待對手 -->
<div id="waiting">
  <div class="spinner"></div>
  <p id="waitingText">等待對手加入...</p>
</div>

<!-- 結果 -->
<div id="result">
  <div class="result-box">
    <h2 id="resultTitle">🏆 你贏了！</h2>
    <p  id="resultSub">精彩對決！</p>
    <div class="result-btns">
      <button class="rbtn primary" id="btnRematch">再來一局</button>
      <button class="rbtn ghost"   id="btnBackLobby">返回大廳</button>
    </div>
  </div>
</div>

<script>
'use strict';

// ══════════════════════════════════════════════════════
// 常數
// ══════════════════════════════════════════════════════
const COLS = 25, ROWS = 25, CELL = 20;
const W = COLS * CELL, H = ROWS * CELL; // 500 × 500

const SPEEDS = [180, 155, 130, 108, 88, 70, 56, 44, 34, 26]; // ms/step
const P1_COLOR  = '#4ade80';
const P1_HEAD   = '#86efac';
const P1_FOOD   = '#bbf7d0';
const P2_COLOR  = '#f87171';
const P2_HEAD   = '#fca5a5';
const P2_FOOD   = '#fee2e2';
const DEAD_COLOR= '#374151';

// ══════════════════════════════════════════════════════
// 狀態
// ══════════════════════════════════════════════════════
let mySnake, myDir, myNextDir, myFood;
let oppSnake, oppFood;
let myScore = 0, oppScore = 0;
let myLevel = 1;
let myAlive, oppAlive;
let gameRunning, paused;
let stepTimer;
let myPlayerIndex = -1; // 0 or 1
let particles = [];

// ══════════════════════════════════════════════════════
// Canvas
// ══════════════════════════════════════════════════════
const cv  = document.getElementById('cv');
const ctx = cv.getContext('2d');

// ══════════════════════════════════════════════════════
// WebSocket
// ══════════════════════════════════════════════════════
let ws = null;
let myRoomId = null;

const WS_URL = (() => {
  const meta = document.querySelector('meta[name="ws-url"]');
  if (meta && meta.content) return meta.content;
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  return `${proto}://${location.host}`;
})();

function connectWS(onOpen) {
  ws = new WebSocket(WS_URL);
  ws.onopen    = onOpen;
  ws.onmessage = e => handleMsg(JSON.parse(e.data));
  ws.onclose   = () => { if (gameRunning) showResult(false, '連線中斷'); };
}

function wsSend(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
}

function handleMsg(msg) {
  switch (msg.type) {
    case 'room_joined':
      myRoomId      = msg.roomId;
      myPlayerIndex = msg.playerIndex;
      if (myPlayerIndex === 0) {
        document.getElementById('roomCodeDisplay').textContent = myRoomId;
        document.getElementById('createResult').style.display = 'block';
      }
      break;

    case 'opponent_joined':
      startBattle();
      break;

    case 'opponent_snake':
      oppSnake = msg.snake;
      oppFood  = msg.food;
      oppScore = msg.score || 0;
      document.getElementById('oppScore').textContent = oppScore;
      break;

    case 'opponent_lost':
      // 對手死了 → 我贏
      oppAlive = false;
      endGame(true, '對手撞牆了！');
      break;

    case 'opponent_disconnected':
      showResult(true, '對手已離線');
      break;

    case 'room_error':
      document.getElementById('lobbyError').textContent = '❌ ' + msg.reason;
      break;
  }
}

// ══════════════════════════════════════════════════════
// Lobby
// ══════════════════════════════════════════════════════
document.getElementById('btnCreate').addEventListener('click', () => {
  document.getElementById('lobbyError').textContent = '';
  connectWS(() => wsSend({ type: 'create_room' }));
});

document.getElementById('btnJoin').addEventListener('click', joinRoom);
document.getElementById('joinInput').addEventListener('keydown', e => { if (e.key === 'Enter') joinRoom(); });

function joinRoom() {
  const id = document.getElementById('joinInput').value.trim();
  if (id.length !== 4 || isNaN(id)) {
    document.getElementById('lobbyError').textContent = '請輸入 4 位數字房間碼';
    return;
  }
  document.getElementById('lobbyError').textContent = '';
  connectWS(() => wsSend({ type: 'join_room', roomId: id }));
}

// ══════════════════════════════════════════════════════
// 對戰開始 / 結束
// ══════════════════════════════════════════════════════
function startBattle() {
  document.getElementById('lobby').style.display   = 'none';
  document.getElementById('battle').style.display  = 'flex';
  document.getElementById('battleRoomCode').textContent = myRoomId;

  // 倒數 3 秒
  const overlay = document.getElementById('waiting');
  const p       = document.getElementById('waitingText');
  overlay.querySelector('.spinner').style.display = 'none';
  let count = 3;
  overlay.classList.add('show');
  p.textContent = `遊戲即將開始 ${count}`;
  const t = setInterval(() => {
    count--;
    if (count > 0) p.textContent = `遊戲即將開始 ${count}`;
    else { clearInterval(t); overlay.classList.remove('show'); initGame(); }
  }, 1000);
}

function endGame(iWon, reason = '') {
  if (!gameRunning) return;
  gameRunning = false;
  clearTimeout(stepTimer);
  if (!iWon) wsSend({ type: 'game_over' });
  showResult(iWon, `${reason} 分數：${myScore}`);
}

function showResult(win, sub) {
  gameRunning = false;
  clearTimeout(stepTimer);
  const o = document.getElementById('result');
  document.getElementById('resultTitle').textContent = win ? '🏆 你贏了！' : '💀 你輸了';
  document.getElementById('resultTitle').className   = win ? 'win' : 'lose';
  document.getElementById('resultSub').textContent   = sub;
  o.classList.add('show');
}

document.getElementById('btnRematch').addEventListener('click',  () => location.reload());
document.getElementById('btnBackLobby').addEventListener('click',() => location.reload());

// ══════════════════════════════════════════════════════
// 遊戲初始化
// ══════════════════════════════════════════════════════
function initGame() {
  myScore = 0; oppScore = 0; myLevel = 1;
  myAlive = true; oppAlive = true;
  gameRunning = true; paused = false;
  particles = [];

  // 根據 playerIndex 決定出生位置（左邊 vs 右邊）
  if (myPlayerIndex === 0) {
    mySnake  = [{x:4,y:12},{x:3,y:12},{x:2,y:12}];
    myDir    = {x:1, y:0};
    myNextDir= {x:1, y:0};
  } else {
    mySnake  = [{x:20,y:12},{x:21,y:12},{x:22,y:12}];
    myDir    = {x:-1, y:0};
    myNextDir= {x:-1, y:0};
  }

  oppSnake = null;
  oppFood  = null;
  placeFood();
  updateHUD();
  doStep();
}

// ══════════════════════════════════════════════════════
// 食物
// ══════════════════════════════════════════════════════
function placeFood() {
  let pos;
  const occupied = new Set(mySnake.map(s => `${s.x},${s.y}`));
  if (oppSnake) oppSnake.forEach(s => occupied.add(`${s.x},${s.y}`));
  do {
    pos = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
  } while (occupied.has(`${pos.x},${pos.y}`));
  myFood = pos;
}

// ══════════════════════════════════════════════════════
// 遊戲步驟
// ══════════════════════════════════════════════════════
function doStep() {
  if (!gameRunning || paused) return;

  myDir = myNextDir;
  const head = { x: mySnake[0].x + myDir.x, y: mySnake[0].y + myDir.y };

  // 碰牆
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
    endGame(false, '撞牆了！'); return;
  }
  // 碰自己
  if (mySnake.some(s => s.x === head.x && s.y === head.y)) {
    endGame(false, '咬到自己！'); return;
  }
  // 碰對手身體
  if (oppSnake && oppSnake.some(s => s.x === head.x && s.y === head.y)) {
    endGame(false, '撞到對手！'); return;
  }

  mySnake.unshift(head);

  // 吃食物
  if (head.x === myFood.x && head.y === myFood.y) {
    myScore++;
    myLevel = Math.min(10, Math.floor(myScore / 5) + 1);
    spawnEatParticles(head.x, head.y, P1_COLOR);
    placeFood();
    updateHUD();
  } else {
    mySnake.pop();
  }

  // 同步自己的狀態給對手
  wsSend({ type: 'snake_state', snake: mySnake, food: myFood, score: myScore });

  draw();
  stepTimer = setTimeout(doStep, SPEEDS[myLevel - 1]);
}

// ══════════════════════════════════════════════════════
// 粒子
// ══════════════════════════════════════════════════════
function spawnEatParticles(gx, gy, color) {
  for (let i = 0; i < 6; i++) {
    const a = Math.random() * Math.PI * 2, s = 1.5 + Math.random() * 2.5;
    particles.push({ x: gx*CELL+CELL/2, y: gy*CELL+CELL/2, vx: Math.cos(a)*s, vy: Math.sin(a)*s - 1.5, color, life: 60, size: 2 + Math.random() * 2.5 });
  }
}

// ══════════════════════════════════════════════════════
// 繪製
// ══════════════════════════════════════════════════════
let tick = 0;
function draw() {
  tick++;
  ctx.fillStyle = '#080f10';
  ctx.fillRect(0, 0, W, H);

  // 格線
  ctx.strokeStyle = 'rgba(74,222,128,0.04)'; ctx.lineWidth = 1;
  for (let c = 0; c <= COLS; c++) { ctx.beginPath(); ctx.moveTo(c*CELL,0); ctx.lineTo(c*CELL,H); ctx.stroke(); }
  for (let r = 0; r <= ROWS; r++) { ctx.beginPath(); ctx.moveTo(0,r*CELL); ctx.lineTo(W,r*CELL); ctx.stroke(); }

  // 粒子
  particles = particles.filter(p => p.life > 0);
  for (const p of particles) {
    ctx.globalAlpha = p.life / 60;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
    p.x += p.vx; p.y += p.vy; p.vy += 0.3; p.life -= 4;
  }
  ctx.globalAlpha = 1;

  // 對手食物
  if (oppFood) drawFoodDot(oppFood.x, oppFood.y, P2_FOOD, '#fca5a5');

  // 我的食物（脈衝光暈）
  if (myFood) drawFoodDot(myFood.x, myFood.y, P1_FOOD, '#86efac');

  // 對手蛇
  if (oppSnake) drawSnake(oppSnake, P2_COLOR, P2_HEAD, {x:0,y:0}, false);

  // 我的蛇
  drawSnake(mySnake, P1_COLOR, P1_HEAD, myDir, true);
}

function drawFoodDot(gx, gy, color, glow) {
  const cx = gx*CELL+CELL/2, cy = gy*CELL+CELL/2;
  const pulse = 1 + 0.12 * Math.sin(tick * 0.15);
  const grad = ctx.createRadialGradient(cx,cy,0,cx,cy,CELL*0.8);
  grad.addColorStop(0, glow + '44'); grad.addColorStop(1, 'transparent');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(cx,cy,CELL*0.8,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(cx,cy,(CELL/2-1)*pulse,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.beginPath(); ctx.arc(cx-2,cy-2,2.5,0,Math.PI*2); ctx.fill();
}

function drawSnake(snake, bodyColor, headColor, dir, drawEyes) {
  snake.forEach((seg, i) => {
    const t = i / snake.length;
    const x = seg.x*CELL+1, y = seg.y*CELL+1, s = CELL-2;
    if (i === 0) {
      ctx.fillStyle = headColor;
      // 頭部光暈
      ctx.shadowColor = headColor; ctx.shadowBlur = 8;
    } else {
      const hue    = bodyColor === P1_COLOR ? 142 : 0;
      const satStr = bodyColor === P1_COLOR ? `${70 - t*20}%` : `${80 - t*20}%`;
      const litStr = `${50 - t*18}%`;
      ctx.fillStyle = `hsl(${hue},${satStr},${litStr})`;
      ctx.shadowBlur = 0;
    }
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x,y,s,s,4); else ctx.rect(x,y,s,s);
    ctx.fill();
    ctx.shadowBlur = 0;

    // 高光
    if (i === 0) {
      ctx.fillStyle = 'rgba(255,255,255,0.28)';
      ctx.fillRect(seg.x*CELL+2, seg.y*CELL+2, CELL-4, 5);
    }

    // 眼睛（只畫自己的蛇以區分方向）
    if (i === 0 && drawEyes) {
      ctx.fillStyle = '#0a1a0a';
      const [e1x,e1y,e2x,e2y] = eyePos(dir, seg);
      ctx.beginPath(); ctx.arc(e1x,e1y,2,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(e2x,e2y,2,0,Math.PI*2); ctx.fill();
    }
  });
}

function eyePos(d, seg) {
  const bx=seg.x*CELL, by=seg.y*CELL;
  if (d.x===1)  return [bx+14,by+5, bx+14,by+13];
  if (d.x===-1) return [bx+4, by+5, bx+4, by+13];
  if (d.y===-1) return [bx+5, by+4, bx+13,by+4];
  return               [bx+5, by+14,bx+13,by+14];
}

// ══════════════════════════════════════════════════════
// HUD
// ══════════════════════════════════════════════════════
function updateHUD() {
  document.getElementById('myScore').textContent  = myScore;
  document.getElementById('oppScore').textContent = oppScore;
}

// ══════════════════════════════════════════════════════
// 鍵盤
// ══════════════════════════════════════════════════════
const DIR_MAP = {
  ArrowUp:{x:0,y:-1}, w:{x:0,y:-1}, W:{x:0,y:-1},
  ArrowDown:{x:0,y:1}, s:{x:0,y:1}, S:{x:0,y:1},
  ArrowLeft:{x:-1,y:0}, a:{x:-1,y:0}, A:{x:-1,y:0},
  ArrowRight:{x:1,y:0}, d:{x:1,y:0}, D:{x:1,y:0},
};

function tryDir(d) {
  if (!d || !gameRunning) return;
  if (d.x !== -myDir.x || d.y !== -myDir.y) myNextDir = d;
}

document.addEventListener('keydown', e => {
  const d = DIR_MAP[e.key];
  if (d) { e.preventDefault(); tryDir(d); }
  if (e.key === 'p' || e.key === 'P') {
    paused = !paused;
    if (!paused && gameRunning) doStep();
  }
});

// 觸控方向盤
[['dUp',{x:0,y:-1}],['dDown',{x:0,y:1}],['dLeft',{x:-1,y:0}],['dRight',{x:1,y:0}]]
  .forEach(([id, d]) => {
    document.getElementById(id).addEventListener('touchstart', e => {
      e.preventDefault(); tryDir(d);
    }, { passive: false });
  });

// 滑動手勢
let tStart = null;
cv.addEventListener('touchstart', e => { tStart = {x:e.touches[0].clientX, y:e.touches[0].clientY}; }, {passive:true});
cv.addEventListener('touchend', e => {
  if (!tStart) return;
  const dx = e.changedTouches[0].clientX - tStart.x;
  const dy = e.changedTouches[0].clientY - tStart.y;
  if (Math.abs(dx) > Math.abs(dy)) tryDir(dx > 0 ? {x:1,y:0} : {x:-1,y:0});
  else tryDir(dy > 0 ? {x:0,y:1} : {x:0,y:-1});
  tStart = null;
}, {passive:true});

// ══════════════════════════════════════════════════════
// 初始畫面
// ══════════════════════════════════════════════════════
ctx.fillStyle = '#080f10';
ctx.fillRect(0, 0, W, H);
</script>
